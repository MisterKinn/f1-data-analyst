name: Macau GP best laps (official result PDFs)

# Owner 2026-11-21: every series with a public source. macau.grandprix.gov.mo lists each session's ITS-events classification PDF
# (/api/game/result_list; robots.txt allows all). scripts/sim/learn/fetch-macau.mjs keeps one row per car and session; scanned PDFs
# (no text) are skipped and logged. Weekly and after Macau sessions.

on:
  schedule:
    - cron: '31 8 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # start the stored-views rebuild after publishing

concurrency:
  group: macau-laps
  cancel-in-progress: false

jobs:
  laps:
    if: github.repository == 'MisterKinn/f1-data-analyst'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read the Macau GP result PDFs
        run: node scripts/sim/learn/fetch-macau.mjs | tail -40
      - name: Publish to main (checks first)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          scripts/publish-refresh.sh -k -m "Macau GP best laps per car and session (one row per car and session)" \
            -g "node scripts/sim/learn/fetch-macau.mjs" -b lapsim-learn/macau-laps \
            -c "node scripts/refresh-changed.mjs scripts/sim/data/learn/macau-laps.json.gz" -- scripts/sim/data/learn/macau-laps.json.gz
