name: Lap simulator learning data (network sources)

# Reads published timing the shell cannot reach (Formula E Al Kamel tree, source probes) and commits derived tables back to the
# branch. Push to lapsim-learn/**. Never runs on main. Rules: docs/lapsim-learn.md.
on:
  push:
    branches: ['lapsim-learn/**']
    paths: ['scripts/sim/learn/fetch-*.mjs', 'scripts/sim/learn/probe-*.mjs', '.github/workflows/lapsim-learn.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lapsim-learn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: node scripts/sim/learn/probe-sources.mjs
        continue-on-error: true
      - run: node scripts/sim/learn/fetch-fe.mjs
        continue-on-error: true
      - name: Commit the derived tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add scripts/sim/data/learn
          git diff --cached --quiet || (git commit -m "Learning data: Formula E cars per session, source probes" && (git push origin HEAD:"${{ github.ref_name }}" || (git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}")))
