name: Lap simulator learning data (network sources)

# Reads published timing the shell cannot reach (Formula E Al Kamel tree, source probes) and commits derived tables back to the
# branch. Push to lapsim-learn/**. Never runs on main. Rules: docs/lapsim-learn.md.
on:
  push:
    branches: ['lapsim-learn/**']
    paths: ['scripts/sim/learn/fetch-*.mjs', 'scripts/sim/learn/probe-*.mjs', '.github/workflows/lapsim-learn.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lapsim-learn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Stored lap rows of the all-laps run (for fetch-rows.mjs)
        if: ${{ contains(github.event.head_commit.message, 'rows') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p .cache/t71-rows && gh run download 42927630531 -R ${{ github.repository }} -p 'laps-t71-*' -p 'laps-wec' -D .cache/t71-rows || true
      # push: run the fetch/probe scripts changed by the pushed commit; manual run: all of them
      - name: Run the fetch scripts
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then JOBS=$(git diff --name-only HEAD~1 HEAD -- 'scripts/sim/learn/fetch-*.mjs' 'scripts/sim/learn/probe-*.mjs'); else JOBS=$(ls scripts/sim/learn/fetch-*.mjs scripts/sim/learn/probe-*.mjs); fi
          for j in $JOBS; do echo "::group::$j"; node "$j" || echo "::warning::$j failed"; echo "::endgroup::"; done
      - name: Commit the derived tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add scripts/sim/data/learn
          git diff --cached --quiet || (git commit -m "Learning data from the network sources (fetch scripts of the pushed commit)" && (git push origin HEAD:"${{ github.ref_name }}" || (git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}")))
