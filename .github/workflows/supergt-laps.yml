name: SUPER GT best laps (official result pages)

# Owner 2026-11-21: every series with a public source. supergt.net publishes each session as an HTML table (best lap, laps, tyre,
# success weight per car); scripts/sim/learn/fetch-supergt.mjs keeps one row per car and session. Weekly and after SUPER GT
# qualifying and races.

on:
  schedule:
    - cron: '7 8 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # start the stored-views rebuild after publishing

concurrency:
  group: supergt-laps
  cancel-in-progress: false

jobs:
  laps:
    if: github.repository == 'MisterKinn/f1-data-analyst'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Read the SUPER GT result pages
        run: node scripts/sim/learn/fetch-supergt.mjs | tail -40
      - name: Publish to main (checks first)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          scripts/publish-refresh.sh -m "SUPER GT best laps per car and session (one row per car and session)" \
            -g "node scripts/sim/learn/fetch-supergt.mjs" -b lapsim-learn/supergt-laps \
            -c "node scripts/refresh-changed.mjs scripts/sim/data/learn/supergt-laps.json.gz" -- scripts/sim/data/learn/supergt-laps.json.gz
