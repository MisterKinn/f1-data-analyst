name: Test shared F1 plugin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f1-${{ github.event_name == 'pull_request' && github.ref || 'main-tests' }}
  cancel-in-progress: true
jobs:
  # every workflow file: actionlint syntax/expression checks block; shellcheck findings on run: scripts are listed only (17 on main,
  # 2026-11-25, all warning/info/style; fix them file by file)
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: actionlint (blocking, without shellcheck)
        run: ./actionlint -color -shellcheck=
      - name: shellcheck findings (report only)
        run: ./actionlint -color || true
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r collector/requirements.txt
      - run: python -m pip install -r discord-bot/requirements.txt
      - run: node --test tests/*.test.mjs
        env:
          KONGBODA_FEATURES: all  # hidden features stay tested
      - run: node --test tests/features-off.test.mjs
      - run: python -m unittest discover -s collector -p 'test_*.py'
      - run: cd discord-bot && python -m unittest discover -s tests
      - run: node scripts/build.mjs
      - run: node scripts/validate-artifact.mjs
      - name: Validate Discord image
        run: docker build -f discord-bot/Dockerfile -t kongboda-discord:ci .
