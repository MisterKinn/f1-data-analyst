name: F1 zones refresh

# Owner 2026-11-16: the Straight Mode / DRS zones of the remaining races (and 2027) update themselves when the FIA publishes the
# Race Director's circuit map, and each session's grip state (Low Grip Conditions -> Alt zones, Overtake/DRS disabled) is learned
# from race control. Reads the FIA circuit maps and OpenF1 race control, rebuilds worker/lapsim/f1-zones-data.js, and reads the
# real pole laps from TracingInsights (scripts/sim/f1-poles.mjs). Owner 2026-11-21: the result goes live by itself —
# scripts/publish-refresh.sh runs the CI checks and pushes to main (measured lookups, no model gate needed).
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # start the stored-views rebuild after publishing

concurrency:
  group: f1-zones-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'MisterKinn/f1-data-analyst'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Refresh zones, grip state and poles
        id: gen
        run: |
          cat > /tmp/gen.sh <<'GEN'
          set -e
          node scripts/sim/learn/fetch-f1-zones.mjs
          node scripts/sim/learn/fetch-aero-state.mjs || echo "::warning::OpenF1 race control not reachable"
          node scripts/sim/f1-zones.mjs
          # real pole laps: TracingInsights qualifying laps (sparse clone; both seasons, the script rebuilds the whole file)
          for y in 2025 2026; do
            [ -d .cache/ti/$y ] || git clone -q --depth 1 --filter=blob:none --sparse https://github.com/TracingInsights/$y .cache/ti/$y
            git -C .cache/ti/$y sparse-checkout set --no-cone '/*Grand Prix/Qualifying/*/laptimes.json'
          done
          LAPSIM_TI_DIR=.cache/ti node scripts/sim/f1-poles.mjs
          LAPSIM_TI_DIR=.cache/ti node scripts/sim/f1-driver-quali.mjs
          LAPSIM_TI_DIR=.cache/ti node scripts/sim/f1-real-telemetry.mjs
          # prediction log (AGENTS.md Gate G v3.1): every series' qualifying prediction before the event, real result after (all series)
          node scripts/sim/prediction-log.mjs
          GEN
          bash /tmp/gen.sh
      - name: Publish to main (checks first)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          scripts/publish-refresh.sh -m "F1 zones, session grip state and real poles (FIA circuit maps, race control, TracingInsights)" \
            -g "bash /tmp/gen.sh" -b lapsim-learn/zones-refresh \
            -c "node scripts/refresh-changed.mjs worker/lapsim/f1-zones-data.js scripts/sim/data/learn/f1-aero-state.json worker/lapsim/f1-poles-data.js worker/lapsim/f1-driver-quali-data.js worker/lapsim/f1-real-telemetry-data.js scripts/sim/data/prediction-log.json worker/lapsim/prediction-log-data.js" \
            -- scripts/sim/data/learn worker/lapsim/f1-zones-data.js worker/lapsim/f1-poles-data.js worker/lapsim/f1-driver-quali-data.js worker/lapsim/f1-real-telemetry-data.js scripts/sim/data/prediction-log.json worker/lapsim/prediction-log-data.js
      - name: Remove old refresh branches (main has newer data)
        if: success()
        run: |
          for b in $(git ls-remote --heads origin 'lapsim-learn/zones-refresh-*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            git push -q origin --delete "$b" && echo "deleted $b"
          done
