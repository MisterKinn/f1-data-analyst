name: Gate ledger reference
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt
      - run: node scripts/ci/ledger-ref.mjs changed.txt
