name: Probe WEC stints
on:
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  stints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts > /dev/null
      - run: node scripts/sim/wec-stints.mjs
      - name: Commit the stints
        run: |
          mkdir -p scripts/sim/data && cp .cache/lapsim/wec-stints.json scripts/sim/data/wec-stints.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add scripts/sim/data/wec-stints.json && git commit -m "WEC stints from Al Kamel" && git push
