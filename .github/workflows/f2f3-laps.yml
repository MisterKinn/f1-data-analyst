name: F2 and F3 best laps (FIA classifications)

# Owner 2026-11-21: read F2 and F3 too. scripts/sim/learn/fetch-f2f3.mjs reads the FIA classification documents with the site's own
# FIA reader (worker/fia.js) and keeps derived numbers only (best lap, its lap, laps, km/h per driver and session); no document is stored.
# Started by "Refresh after sessions" about 1, 3 and 6 h after a session; weekly as a safety net. Publishes through
# scripts/publish-refresh.sh (CI checks, then main).
on:
  schedule:
    - cron: '53 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # start the stored-views rebuild after publishing

concurrency:
  group: f2f3-laps
  cancel-in-progress: false

jobs:
  laps:
    if: github.repository == 'MisterKinn/f1-data-analyst'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Read the FIA F2 and F3 classifications
        run: |
          node scripts/sim/learn/fetch-f2f3.mjs | tee /tmp/f2f3.log | tail -15
          echo "races where the fastest lap differs from the FIA overall fastest: $(grep -c "fastest ✗" /tmp/f2f3.log || true)"
      - name: Publish to main (checks first)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          scripts/publish-refresh.sh -m "F2 and F3 best laps from FIA classifications (one row per car and session)" \
            -g "node scripts/sim/learn/fetch-f2f3.mjs" -b lapsim-learn/f2f3-laps \
            -c "node scripts/refresh-changed.mjs scripts/sim/data/learn/f2f3-laps.json.gz" -- scripts/sim/data/learn/f2f3-laps.json.gz
