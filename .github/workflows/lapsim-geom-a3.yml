name: Lap simulator car-free geometry, attempt 3 (all tracks)

# Step 3 attempt 3 (claude/gate-independent-geometry-attempt3-prereg-2026-11-23.md). GitHub-hosted jobs stop at 6 h, so the build is
# split: GROUPS jobs, each fetches and builds every GROUPS-th track (OSM raceway ways and areas, today and per older layout era, the
# best open elevation model) and uploads its per-track parts; `merge` writes tracks-a3.json in the canonical order and pushes it to
# probe/geom-a3-out. `split-check` builds two tracks once in one job and once in two parts from the same sources and fails unless the
# merged output is byte-identical. Raw sources stay on the runners (artifacts only).
# TRACKS in .github/geom-a3-tracks.txt: "all" or comma-separated ids (a short list for a quick check).
on:
  push:
    branches: ['probe/geom-a3-fetch']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lapsim-geom-a3
  cancel-in-progress: true

env:
  GROUPS: 6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy requests pillow rasterio pyproj && npm ci --ignore-scripts
      - name: Track ids of this group
        run: |
          node scripts/sim/geom-indep/build-a3.mjs eras /tmp/raw/eras.json > /dev/null
          ALL=$(node scripts/sim/geom-indep/build-a3.mjs ids --group ${{ matrix.group }}/$GROUPS)
          SEL=$(cat .github/geom-a3-tracks.txt 2>/dev/null || echo all)
          if [ "$SEL" = all ]; then IDS="$ALL"; else IDS=$(echo "$ALL" | tr ',' '\n' | grep -x -F -f <(echo "$SEL" | tr ',' '\n') | paste -sd, - || true); fi
          echo "IDS=$IDS" >> "$GITHUB_ENV"; echo "group ${{ matrix.group }}: $IDS"
      - name: Fetch OSM and elevation
        if: env.IDS != ''
        run: python scripts/sim/geom-indep/fetch_a3.py /tmp/raw "$IDS"
      - name: Build this group's tracks
        if: env.IDS != ''
        run: node scripts/sim/geom-indep/build-a3.mjs parts /tmp/raw --only "$IDS" --jobs 4 --to /tmp/parts && cp /tmp/raw/fetch-log.json /tmp/parts/fetch-log-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        if: env.IDS != ''
        with:
          name: geom-a3-parts-${{ matrix.group }}
          path: /tmp/parts
          retention-days: 7

  split-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy requests pillow rasterio pyproj && npm ci --ignore-scripts
      - name: One job vs two parts on the same sources (suzuka, zandvoort)
        run: |
          B=scripts/sim/geom-indep/build-a3.mjs
          node $B eras /tmp/raw/eras.json > /dev/null
          python scripts/sim/geom-indep/fetch_a3.py /tmp/raw suzuka,zandvoort
          node $B build /tmp/raw --only suzuka,zandvoort --out /tmp/single
          node $B parts /tmp/raw --only suzuka --to /tmp/p1 && node $B parts /tmp/raw --only zandvoort --to /tmp/p2
          node $B merge /tmp/p2 /tmp/p1 --out /tmp/split
          mkdir -p /tmp/check
          if cmp /tmp/single/tracks-a3.json /tmp/split/tracks-a3.json && cmp /tmp/single/build-report-a3.json /tmp/split/build-report-a3.json; then
            echo "split-check: byte-identical (suzuka, zandvoort; tracks-a3.json sha256 $(sha256sum /tmp/single/tracks-a3.json | cut -c1-16))" | tee /tmp/check/split-check.txt
          else echo "split-check: DIFFERENT" | tee /tmp/check/split-check.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: geom-a3-split-check
          path: /tmp/check

  merge:
    needs: [build, split-check]
    if: always() && needs.split-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: geom-a3-*
          path: /tmp/art
      - name: Merge the group parts
        run: |
          node scripts/sim/geom-indep/build-a3.mjs merge $(ls -d /tmp/art/geom-a3-parts-*) --out /tmp/out
          cp /tmp/art/geom-a3-parts-*/fetch-log-*.json /tmp/art/geom-a3-split-check/split-check.txt /tmp/out/
          echo "groups merged: $(ls -d /tmp/art/geom-a3-parts-* | wc -l) of $GROUPS; build job results: ${{ needs.build.result }}" >> /tmp/out/split-check.txt
      - name: Push derived geometry to the probe branch
        run: |
          cd /tmp/out && ls -la
          git init -q -b probe/geom-a3-out && git add -A
          git -c user.name="kongboda-lapsim[bot]" -c user.email="lapsim@users.noreply.github.com" commit -qm "Car-free geometry attempt 3, run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe/geom-a3-out
