name: Lap simulator data

# Rebuilds the lap simulator's tracks and car calibration from OpenF1 qualifying data (F1) and
# Al Kamel published timing (WEC).
# Raw OpenF1/MultiViewer responses stay in the Actions cache; only derived geometry, fitted
# parameters and the report are committed (worker/lapsim/*-data.js, docs/lapsim-report.md).
# - push to a lapsim/** branch: rebuild and commit back to that branch
# - weekly schedule (upstream only) or manual run: rebuild and push a lapsim/refresh-* branch
on:
  push:
    branches: ['lapsim/**']
    paths-ignore: ['worker/lapsim/tracks-data.js', 'worker/lapsim/calibration-data.js', 'worker/lapsim/track-changes-data.js', 'docs/lapsim-report.md', 'docs/lapsim-geometry.md']
  schedule:
    - cron: '17 3 * * 2' # Tuesday 12:17 Korea time, after the race weekend
  workflow_dispatch:
    inputs:
      years:
        description: 'Seasons to fetch (comma separated)'
        required: false
        default: '2023,2024,2025,2026'
      trace_drivers:
        description: 'Fastest drivers per qualifying session whose speed trace is used'
        required: false
        default: '10'
      calibrate:
        description: 'Calibrate and commit (false: only build data and upload it as an artifact)'
        required: false
        default: 'true'
      tracks:
        description: 'keep: calibrate on the committed track shapes (traces scaled to them); rebuild: new shapes from the data'
        required: false
        default: 'keep'

permissions:
  contents: write

concurrency:
  group: lapsim-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Two jobs, each under the 340-minute limit (2026-11-18: the 2 h track build plus the A6 calibration, 3.5 h and still running,
  # hit the limit in run 44112257363): `prepare` fetches and builds the tracks, `rebuild` calibrates and commits.
  prepare:
    if: github.event_name != 'schedule' || github.repository == 'MisterKinn/f1-data-analyst'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/lapsim/raw
          key: lapsim-raw-v1-${{ github.run_id }}
          restore-keys: lapsim-raw-v1-
      - name: Fetch OpenF1 qualifying data
        timeout-minutes: 150
        env:
          LAPSIM_TRACE_DRIVERS: ${{ inputs.trace_drivers || '10' }}
        # stop on any failed qualifying session: OpenF1 answers 401 to free use while an F1 session is live (run 44840216114 during Las
        # Vegas FP3 calibrated on 230 of 885 traces, one season, and failed 9 tests); rerun when no session is live
        run: |
          set -o pipefail; mkdir -p .cache
          node scripts/sim/fetch-openf1.mjs "${{ inputs.years || '2023,2024,2025,2026' }}" | tee .cache/fetch-openf1.log
          if grep -E '^fail [0-9]{4} ' .cache/fetch-openf1.log; then echo "::error::OpenF1 fetch incomplete (401 = an F1 session is live)"; exit 1; fi
      # saved even when a later step fails, so a rerun does not fetch everything again
      - name: Save raw data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/lapsim/raw
          key: lapsim-raw-v1-${{ github.run_id }}
      # keep (default, owner 2026-11-18): a rebuild moves every F1 track by metres and the hand-built zones, car lines and stored
      # lines then no longer fit (run 44180547107: 6 tests failed), so the cars are fitted on the committed shapes
      - name: Choose track smoothing and build tracks
        if: (inputs.tracks || 'keep') == 'rebuild'
        run: node scripts/sim/tune-geometry.mjs
      - name: Speed traces on the committed tracks
        if: (inputs.tracks || 'keep') != 'rebuild'
        run: LAPSIM_TRACKS_OUT=.cache/lapsim/tracks-built.mjs node scripts/sim/build-geometry.mjs && node scripts/sim/traces-to-tracks.mjs .cache/lapsim/tracks-built.mjs
      - run: npm ci --omit=dev --ignore-scripts
      # build-geometry.mjs writes only the F1 tracks: put back the extra tracks (second export, from their committed sources) and the
      # dense map points, as docs/lapsim-tracks-extra.md describes (2026-11-17 run 44069662431 failed at calibrate: no lapsimExtraTracks)
      - name: Rebuild extra tracks and dense maps
        if: (inputs.tracks || 'keep') == 'rebuild'
        run: node scripts/sim/build-geometry-extra.mjs > /dev/null && node scripts/sim/densify-maps.mjs
      # zone positions are metres on the track line: rebuild them on the new geometry (2026-11-18 run 44180547107 failed its zone
      # test: rebuilt Imola 4 m shorter, the old zone 4 then ran into a bend). Reads only the stored FIA zone text, no network.
      - name: Rebuild F1 zones on the new tracks
        if: (inputs.tracks || 'keep') == 'rebuild'
        run: node scripts/sim/f1-zones.mjs > /dev/null
      - name: Fetch WEC timing (Al Kamel)
        run: node scripts/sim/fetch-wec.mjs && node scripts/sim/wec-poles.mjs
      # derived speed traces and tracks for local calibration experiments (not committed)
      - name: Upload derived data
        uses: actions/upload-artifact@v4
        with:
          name: lapsim-derived
          path: |
            .cache/lapsim/traces.json
            .cache/lapsim/wec.json
            .cache/lapsim/races.json
            .cache/lapsim/races/
            worker/lapsim/tracks-data.js
            worker/lapsim/f1-zones-data.js
          retention-days: 5
          include-hidden-files: true
      # everything the build changed (tracks, WEC poles) plus the derived cache, for the next job
      - name: Bundle the build for the calibration job
        run: |
          files=$(git ls-files -m -o --exclude-standard worker scripts docs)
          tar czf /tmp/lapsim-prep.tgz --exclude=.cache/lapsim/raw .cache/lapsim $files
      - uses: actions/upload-artifact@v4
        with:
          name: lapsim-prep
          path: /tmp/lapsim-prep.tgz
          retention-days: 2
  rebuild:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/lapsim/raw
          key: lapsim-raw-v1-${{ github.run_id }}
          restore-keys: lapsim-raw-v1-
      - uses: actions/download-artifact@v4
        with:
          name: lapsim-prep
          path: /tmp
      - name: Unpack the build
        run: tar xzf /tmp/lapsim-prep.tgz
      - run: npm ci --omit=dev --ignore-scripts
      # official recharge limits (FIA PU documents) and 2027/28 + FE Gen4 rule values feed the fit
      - name: Read FIA energy documents and regulation values
        continue-on-error: true
        run: node scripts/sim/energy-docs.mjs && node scripts/sim/rule-params.mjs
      # settings chosen from the calibration experiments (scripts/sim/experiments.json rounds 1–2):
      # best of experiment round 3: joint fit, lap time ×20, sectors ×2, per-track drag, team pace and
      # development, prior weight 8 (holdout 0.81% / 0.85%)
      - name: Calibrate cars (F1 and WEC)
        if: inputs.calibrate != 'false'
        env:
          # fit settings: the script defaults = the published fit (5 rounds x 200 steps, all four seasons). G1 2026-11-18: 3 x 100
          # raised the held-out error on all 34 poles (1.014 -> 1.205 %, Gate G reject). The calibration job is separate from the
          # 2 h build since run 44259689110 (3 x 100 took 40 min, so 5 x 200 is about 2 h 15 min, under the 340-minute limit)
          # A6 (owner 2026-11-17): FIA zones + 2026 PU qualifying curve (experiment run 43775148422, variant zq: all 1.235 -> 1.144 %,
          # WEC 1.432 -> 1.210 %, F1 1.008 -> 1.075 %; the owner accepts the F1 cost of following the real 2026 PU rules)
          LAPSIM_FIA_ZONES: 'on'
          LAPSIM_PU_QUALI: 'on'
          # C5.12 power-reduction ramp in the fit (run 44886079566, Gate G v2 correctness, m = 2, k = 1.45): F1 1.070 -> 0.983 %, RMS loss
          # bound 0.019 <= 0.054 (pass). WEC moved only through the shared F1 track grip, which is frozen for WEC since #381
          LAPSIM_PU_RAMP: 'on'
          # Hypercar (LMH/LMDh) peak braking capped at the iRacing GTP envelope 8.63 + 0.003234 v^2 m/s^2 (owner rule 14: learned from
          # iRacing, "model"). Experiment 44043761033: hypercar holdout mean 1.24 -> 1.16 % (BE0 -> BE1; 1.15x envelope BE2: 1.20 %)
          LAPSIM_BRAKE_ENV_HYPER: '8.63,0.003234'
        run: node scripts/sim/calibrate.mjs
      # TracingInsights race laps 2018 on; reference = mean of the best 8 qualifying laps (script defaults)
      # Hypercar per maker (LapSim × BoPSim × SetupSim, owner 2026-11-21): the residuals are learned on the class cars just fitted
      - name: Hypercar per maker
        if: inputs.calibrate != 'false'
        run: node scripts/sim/learn/hypercar-makers.mjs --write
      # qualifying with rain: real pole by default + dry pole estimate (owner 2026-11-22; AGENTS.md "Real laps are never changed")
      - name: Wet qualifying (real pole + dry estimate)
        if: inputs.calibrate != 'false'
        run: node scripts/sim/learn/wet-quali.mjs --write
      - name: Fit race pace (fuel, tyres, pit loss)
        continue-on-error: true
        run: node scripts/sim/race-pace.mjs
      # only with rebuilt tracks: on the kept shapes a rebuild still moved Austin's line 680 -> 677 points (run 44259689110), which
      # broke the per-car lines and walls drawn on it; lapsim-car-lines.yml reruns those after a track rebuild
      - name: Build racing lines (TUM track widths + TracingInsights pole laps)
        if: (inputs.tracks || 'keep') == 'rebuild'
        continue-on-error: true
        run: node scripts/sim/racing-lines.mjs
      - name: Hypercar stints (Al Kamel race timing) and stint-energy fit
        continue-on-error: true
        run: node scripts/sim/wec-stints.mjs && cp .cache/lapsim/wec-stints.json scripts/sim/data/wec-stints.json && node scripts/sim/stint-fit.mjs
      - name: Brakes against Brembo published figures
        continue-on-error: true
        run: node scripts/sim/brake-fit.mjs
      - name: Read FIA circuit changes
        if: inputs.calibrate != 'false'
        run: node scripts/sim/fia-changes.mjs
        env:
          LAPSIM_CHANGE_YEARS: '2023,2024,2025,2026'
      - name: Learn circuit-change effects (kerbs, resurfacing) from speed traces
        if: inputs.calibrate != 'false'
        continue-on-error: true
        run: node scripts/sim/change-effects.mjs
      - name: Test
        if: inputs.calibrate != 'false'
        run: node --test tests/lapsim*.test.mjs
        env:
          LAPSIM_TRACKS_REBUILT: ${{ (inputs.tracks || 'keep') == 'rebuild' && '1' || '0' }}
      # keep the fit output even when Test fails (2026-11-21: run 44858524098 fitted 3.5 h, failed one test and lost its output)
      - name: Upload calibration output (always)
        if: always() && inputs.calibrate != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: calibration-output
          path: |
            worker/lapsim/calibration-data.js
            docs/lapsim-report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit derived data
        if: inputs.calibrate != 'false'
        run: |
          git config user.name "kongboda-lapsim[bot]"
          git config user.email "lapsim@users.noreply.github.com"
          for f in worker/lapsim/tracks-data.js worker/lapsim/f1-zones-data.js worker/lapsim/calibration-data.js worker/lapsim/track-changes-data.js docs/lapsim-report.md docs/lapsim-geometry.md \
            worker/lapsim/race-data.js docs/lapsim-race.md worker/lapsim/change-effects-data.js worker/lapsim/energy-docs-data.js worker/lapsim/rules-data.js docs/lapsim-rules.md \
            worker/lapsim/racing-lines-data.js docs/lapsim-racing-lines.md \
            worker/lapsim/stint-data.js worker/lapsim/f1-wet-quali-data.js worker/lapsim/hypercar-maker-data.js scripts/sim/data/wec-stints.json worker/lapsim/brake-data.js worker/lapsim/wec-poles-data.js; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild lap simulator tracks and calibration"
          if [ "${{ github.event_name }}" = "push" ]; then
            # the branch may have moved while this ran: replay the data commit on top
            git push origin HEAD:${{ github.ref_name }} || { git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD && git push origin HEAD:${{ github.ref_name }}; }
          else
            branch="lapsim/refresh-$(date -u +%Y%m%d)"
            git push origin HEAD:refs/heads/$branch
            echo "Pushed $branch; open a pull request to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summary
        if: always()
        run: cat docs/lapsim-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
